services:
  app:
    image: fireflyiii/core:version-6.6.6
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      APP_ENV: local
      APP_DEBUG: "false"
      APP_KEY: ${QAP_APP_KEY:?Falta preparar el entorno}
      APP_URL: http://localhost:8081
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: firefly
      DB_USERNAME: firefly
      DB_PASSWORD: ${QAP_DB_PASSWORD:?Falta preparar el entorno}
      MAIL_MAILER: log
      TZ: America/Costa_Rica
    volumes:
      - uploads:/var/www/html/storage/upload
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mariadb:lts
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_USER: firefly
      MYSQL_PASSWORD: ${QAP_DB_PASSWORD:?Falta preparar el entorno}
      MYSQL_DATABASE: firefly
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - database:/var/lib/mysql
volumes:
  uploads:
  database:
